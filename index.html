const AY_ADLARI = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

function bugunEtiketi() {
  const d = new Date();
  return d.toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric", weekday: "long" });
}

function ayBilgisi(ofset) {
  const bugun = new Date();
  const d = new Date(bugun.getFullYear(), bugun.getMonth() + ofset, 1);
  return { etiket: `${AY_ADLARI[d.getMonth()]} ${d.getFullYear()}` };
}

function hesaplaAsgariOdemePlani({ bakiye, aylikFaizYuzde, asgariYuzde, tabanOdeme, vergiYuzde }) {
  const r = aylikFaizYuzde / 100, m = asgariYuzde / 100, vergi = vergiYuzde / 100;
  let bal = bakiye;
  const rows = [];
  let toplamFaiz = 0, toplamOdeme = 0, ay = 0;
  const MAX_AY = 600;
  let hicBitmiyor = false;

  while (bal > 1 && ay < MAX_AY) {
    ay += 1;
    const faiz = bal * r;
    const faizVeVergi = faiz * (1 + vergi);
    let odeme = Math.max(bal * m, tabanOdeme);
    odeme = Math.min(odeme, bal + faizVeVergi);
    if (odeme <= faizVeVergi + 0.01) {
      hicBitmiyor = true;
      rows.push({ ay, bakiye: Math.round(bal) });
      break;
    }
    bal = bal + faizVeVergi - odeme;
    toplamFaiz += faizVeVergi;
    toplamOdeme += odeme;
    rows.push({ ay, bakiye: Math.max(Math.round(bal), 0) });
  }

  return { rows, toplamFaiz: Math.round(toplamFaiz), toplamOdeme: Math.round(toplamOdeme), aySayisi: ay, hicBitmiyor, bitmedi: ay >= MAX_AY && bal > 1 };
}

function sonrakiTekrarGunSayisi(gun) {
  if (!gun) return null;
  const bugun = new Date();
  let hedef = new Date(bugun.getFullYear(), bugun.getMonth(), gun);
  if (hedef < new Date(bugun.getFullYear(), bugun.getMonth(), bugun.getDate())) {
    hedef = new Date(bugun.getFullYear(), bugun.getMonth() + 1, gun);
  }
  return Math.round((hedef - new Date(bugun.getFullYear(), bugun.getMonth(), bugun.getDate())) / 86400000);
}

const BANKALAR = ["Ziraat Bankası","İş Bankası","Garanti BBVA","Akbank","Yapı Kredi","Halkbank","VakıfBank","Denizbank","QNB","TEB"];

// ---------- tarayıcı içinde PDF okuma (Claude'a ihtiyaç duymadan) ----------
let pdfjsYuklemeSozu = null;
function pdfjsYukle() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsYuklemeSozu) return pdfjsYuklemeSozu;
  pdfjsYuklemeSozu = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    script.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    script.onerror = () => reject(new Error("PDF okuyucu yüklenemedi"));
    document.head.appendChild(script);
  });
  return pdfjsYuklemeSozu;
}

async function pdfMetniCikar(dosya) {
  const pdfjsLib = await pdfjsYukle();
  const arrayBuffer = await dosya.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let metin = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const sayfa = await pdf.getPage(i);
    const icerik = await sayfa.getTextContent();
    let sonY = null;
    let satir = "";
    for (const item of icerik.items) {
      const y = item.transform[5];
      if (sonY !== null && Math.abs(y - sonY) > 2) {
        metin += satir.trim() + "\n";
        satir = "";
      }
      satir += item.str + " ";
      sonY = y;
    }
    metin += satir.trim() + "\n";
  }
  return metin;
}

function turkceSayiCoz(str) {
  if (!str) return null;
  let s = str.trim().replace(/[₺TL\s]/gi, "");
  if (/,\d{1,2}$/.test(s)) { s = s.replace(/\./g, "").replace(",", "."); } else { s = s.replace(/,/g, ""); }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

const HARCAMA_KATEGORILERI = [
  { id: "yakit", label: "Yakıt", renk: "#C9A227", anahtarlar: ["SHELL", "BP ", "OPET", "PETROL OFIS", "PETROL OFİS", " TOTAL ", "AYTEMIZ", "ALFA GAZ", "GO ENERJI", "AKARYAKIT"] },

];

const ARAC_SENKRON_KATEGORILERI = ["yakit", "arac-gideri"];

function harcamaKategorisiBul(aciklama) {
  const buyuk = aciklama.toLocaleUpperCase("tr-TR");
  for (const kat of HARCAMA_KATEGORILERI) {
    if (kat.anahtarlar.some((a) => buyuk.includes(a))) return kat.id;
  }
  return "diger";
}

function islemSatirlariCikar(metin) {
  const atlaDeseni = /toplam|asgari|bor[çc]|limit\b|genel\b|sayfa\b|devir\b|hesap\s*[öo]zeti|kesim\s*tarihi|son\s*[öo]deme|faiz\s*oran|kkdf|bsmv|vergi|puan\b|ekstre\s*no|m[üu][şs]teri\s*no|kart\s*no|iban/i;
  const tarihBasiDeseni = /^(\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4})\s+/;
  const taksitDeseni = /\(?\b(\d{1,2})\s*\/\s*(\d{1,2})\b\)?/;
  const sayiDeseni = /(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})\s*(?:TL|₺)?/g;

  const islemler = [];
  const satirlar = metin.split("\n");
  for (const satirHam of satirlar) {
    let satir = satirHam.trim();
    if (!satir || satir.length < 6) continue;
    if (atlaDeseni.test(satir)) continue;

    let tarih = null;
    const tarihE = satir.match(tarihBasiDeseni);
    if (tarihE) { tarih = tarihE[1]; satir = satir.slice(tarihE[0].length); }

    let taksit = null;
    const taksitE = satir.match(taksitDeseni);
    if (taksitE) {
      taksit = { no: parseInt(taksitE[1], 10), sayisi: parseInt(taksitE[2], 10) };
      satir = satir.slice(0, taksitE.index) + " " + satir.slice(taksitE.index + taksitE[0].length);
    }

    const sayilar = [...satir.matchAll(sayiDeseni)];
    if (sayilar.length === 0) continue;
    const sonSayi = sayilar[sayilar.length - 1];
    const aciklama = satir.slice(0, sonSayi.index).trim().replace(/\s{2,}/g, " ");
    const tutar = turkceSayiCoz(sonSayi[1]);

    if (!tutar || tutar <= 0 || tutar > 500000) continue;
    if (!aciklama || !/[a-zA-ZğüşıöçĞÜŞİÖÇ]{3,}/.test(aciklama)) continue;

    islemler.push({ id: uid(), tarih, aciklama, tutar, taksit, kategori: harcamaKategorisiBul(aciklama) });
  }
  return islemler;
}

function ekstreVerisiCikar(metin) {
  const sonuc = { banka: null, bakiye: null, asgariOdemeYuzdesi: null, faizYuzdesi: null, sonOdemeGunu: null };
  const buyukMetin = metin.toLocaleUpperCase("tr-TR");
  for (const b of BANKALAR) {
    const ilkKelime = b.split(" ")[0].toLocaleUpperCase("tr-TR");
    if (buyukMetin.includes(ilkKelime)) { sonuc.banka = b; break; }
  }

  const dene = (desenler) => {
    for (const d of desenler) {
      const e = metin.match(d);
      if (e) return e[1];
    }
    return null;
  };

  sonuc.bakiye = turkceSayiCoz(dene([
    /d[öo]nem\s*borcu\s*[:\-]?\s*([\d.,]+)/i,
    /toplam\s*bor[çc]\s*[:\-]?\s*([\d.,]+)/i,
    /hesap\s*[öo]zeti\s*borcu\s*[:\-]?\s*([\d.,]+)/i,
    /[öo]denecek\s*tutar\s*[:\-]?\s*([\d.,]+)/i,
    /g[üu]ncel\s*bor[çc]\s*[:\-]?\s*([\d.,]+)/i,
  ]));

  const asgariTutar = turkceSayiCoz(dene([/asgari\s*[öo]deme\s*tutar[ıi]\s*[:\-]?\s*([\d.,]+)/i]));
  sonuc.asgariOdemeYuzdesi = turkceSayiCoz(dene([/asgari\s*[öo]deme\s*oran[ıi]\s*[:\-]?\s*%?\s*([\d.,]+)/i]));
  if (!sonuc.asgariOdemeYuzdesi && asgariTutar && sonuc.bakiye) {
    sonuc.asgariOdemeYuzdesi = Math.round((asgariTutar / sonuc.bakiye) * 100);
  }

  sonuc.faizYuzdesi = turkceSayiCoz(dene([
    /ayl[ıi]k\s*akdi\s*faiz\s*oran[ıi]\s*[:\-]?\s*%?\s*([\d.,]+)/i,
    /faiz\s*oran[ıi]\s*[:\-]?\s*%?\s*([\d.,]+)/i,
  ]));

  const tarihE = metin.match(/son\s*[öo]deme\s*tarihi\s*[:\-]?\s*(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/i);
  if (tarihE) sonuc.sonOdemeGunu = parseInt(tarihE[1], 10);

  sonuc.islemler = islemSatirlariCikar(metin);

  return sonuc;
}

function VadeliHesapHesaplayici({ onEkle }) {
  const [acik, setAcik] = useState(false);
  const [anapara, setAnapara] = useState("");
  const [yillikOran, setYillikOran] = useState("");
  const [gunSayisi, setGunSayisi] = useState("30");
  const [stopaj, setStopaj] = useState("0");

  const anaparaN = parseFloat(anapara.replace(",", ".")) || 0;
  const oranN = parseFloat(yillikOran.replace(",", ".")) || 0;
  const gunN = parseInt(gunSayisi, 10) || 0;
  const stopajN = parseFloat(stopaj.replace(",", ".")) || 0;

  const brutGetiri = anaparaN * (oranN / 100) * (gunN / 365);
  const netGetiri = brutGetiri * (1 - stopajN / 100);

  const ekle = () => {
    if (!netGetiri || netGetiri <= 0) return;
    onEkle({ id: uid(), ad: "Vadeli Hesap Getirisi", tutar: Math.round(netGetiri), gun: null });
  };

  return (
    <div className="rounded-2xl bg-[#F1ECE1] p-5 shadow-sm">
      <button onClick={() => setAcik((a) => !a)} className="w-full flex items-center justify-between">
        <div className="flex items-center gap-2"><span>🐷</span><h3 className="font-semibold text-[#1B2430] tracking-tight">Vadeli Hesap Getirisi Hesapla</h3></div>
        <span className="text-[#6B7280]">{acik ? "▲" : "▼"}</span>
      </button>
      {!acik && <p className="text-[11px] text-[#8A8272] mt-1 leading-relaxed">Maaşını günlük faizli/vadeli hesapta tutuyorsan, ne kadar getiri sağlayacağını hesaplayıp gelirlerine ekleyebilirsin.</p>}

      {acik && (
        <div className="mt-3 space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <label className="text-xs text-[#6B7280]">Anapara (₺)
              <input value={anapara} onChange={(e) => setAnapara(e.target.value)} inputMode="decimal"
                className="mt-1 w-full rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
            </label>
            <label className="text-xs text-[#6B7280]">Yıllık Faiz Oranı (%)
              <input value={yillikOran} onChange={(e) => setYillikOran(e.target.value)} inputMode="decimal"
                className="mt-1 w-full rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
            </label>
            <label className="text-xs text-[#6B7280]">Vade (gün)
              <input value={gunSayisi} onChange={(e) => setGunSayisi(e.target.value.replace(/\D/g, "").slice(0, 3))} inputMode="numeric"
                className="mt-1 w-full rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
            </label>
            <label className="text-xs text-[#6B7280]">Stopaj (%)
              <input value={stopaj} onChange={(e) => setStopaj(e.target.value)} inputMode="decimal"
                className="mt-1 w-full rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
            </label>
          </div>
          <p className="text-[11px] text-[#8A8272] leading-relaxed">Güncel stopaj oranını bankandan veya hesap ekstrenden teyit et — bu hesaplama tahminidir.</p>

          <div className="rounded-xl bg-[#1B2430] p-4">
            <p className="text-[11px] uppercase tracking-wider text-[#8A93A3] mb-1">Tahmini Net Getiri</p>
            <p className="font-serif text-2xl font-semibold text-[#C9A227] tabular-nums">{tl(netGetiri)}</p>
            <p className="text-[11px] text-[#8A93A3] mt-1">{gunN} günde · brüt {tl(brutGetiri)}</p>
          </div>

          <button onClick={ekle} disabled={!netGetiri || netGetiri <= 0}
            className="w-full rounded-lg py-2.5 text-white font-medium bg-[#2F6E5C] active:scale-95 flex items-center justify-center gap-2" style={{ opacity: (!netGetiri || netGetiri <= 0) ? 0.4 : 1 }}>
            ＋ Gelirlere Ekle
          </button>
        </div>
      )}
    </div>
  );
}

function KalemListesi({ baslik, renk, kalemler, onEkle, onGuncelle, onSil, emoji }) {
  const [ad, setAd] = useState("");
  const [tutar, setTutar] = useState("");
  const [gun, setGun] = useState("");
  const [duzenlenenId, setDuzenlenenId] = useState(null);

  const formuTemizle = () => { setAd(""); setTutar(""); setGun(""); setDuzenlenenId(null); };
  const duzenlemeyeBasla = (k) => { setDuzenlenenId(k.id); setAd(k.ad); setTutar(String(k.tutar)); setGun(k.gun ? String(k.gun) : ""); };

  const kaydet = () => {
    const t = parseFloat(tutar.replace(",", "."));
    if (!ad.trim() || !t || t <= 0) return;
    const veri = { id: duzenlenenId || uid(), ad: ad.trim(), tutar: t, gun: gun ? parseInt(gun, 10) : null };
    if (duzenlenenId) onGuncelle(veri); else onEkle(veri);
    formuTemizle();
  };

  const toplam = kalemler.reduce((s, k) => s + k.tutar, 0);

  return (
    <div className="rounded-2xl bg-[#F1ECE1] p-5 shadow-sm">
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-2"><span>{emoji}</span><h3 className="font-semibold text-[#1B2430] tracking-tight">{baslik}</h3></div>
        <span className="font-mono text-sm font-semibold" style={{ color: renk }}>{tl(toplam)}</span>
      </div>

      <div className="space-y-2 mb-4 max-h-48 overflow-y-auto">
        {kalemler.length === 0 && <p className="text-sm text-[#8A8272] italic">Henüz kalem eklenmedi.</p>}
        {kalemler.map((k) => (
          <div key={k.id} className={`flex items-center justify-between rounded-lg px-3 py-2 text-sm ${duzenlenenId === k.id ? "bg-[#C9A227]/15 ring-1 ring-[#C9A227]" : "bg-white/60"}`}>
            <div>
              <span className="text-[#1B2430]">{k.ad}</span>
              {k.gun && <span className="ml-2 text-[11px] text-[#8A8272]">· her ayın {k.gun}'i</span>}
            </div>
            <div className="flex items-center gap-3">
              <span className="font-mono text-[#4A4438]">{tl(k.tutar)}</span>
              <button onClick={() => duzenlemeyeBasla(k)} className="text-[#6B7280] hover:text-[#1B2430]">✏️</button>
              <button onClick={() => onSil(k.id)} className="text-[#B24C34]/60 hover:text-[#B24C34]">🗑</button>
            </div>
          </div>
        ))}
      </div>

      {duzenlenenId && <p className="text-[11px] text-[#C9A227] font-medium mb-1.5">Kalem düzenleniyor</p>}
      <div className="flex gap-2 mb-2">
        <input value={ad} onChange={(e) => setAd(e.target.value)} placeholder="Ör. Maaş, Kira"
          className="flex-1 min-w-0 rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
        <input value={tutar} onChange={(e) => setTutar(e.target.value)} onKeyDown={(e) => e.key === "Enter" && kaydet()}
          inputMode="decimal" placeholder="₺"
          className="w-24 rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
      </div>
      <div className="flex gap-2">
        <input value={gun} onChange={(e) => setGun(e.target.value.replace(/\D/g, "").slice(0, 2))} inputMode="numeric"
          placeholder="Her ay tekrar günü (opsiyonel, ör. 1)"
          className="flex-1 min-w-0 rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
        {duzenlenenId && <button onClick={formuTemizle} className="rounded-lg px-3 text-[#6B7280] border border-[#D8D0BE] active:scale-95">✕</button>}
        <button onClick={kaydet} className="rounded-lg px-3 text-white active:scale-95" style={{ backgroundColor: renk }}>{duzenlenenId ? "✓" : "+"}</button>
      </div>
    </div>
  );
}

function AracGiderBolumu({ kalemler, kartKalemleri, onEkle, onGuncelle, onSil }) {
  const [ad, setAd] = useState("");
  const [tutar, setTutar] = useState("");
  const [kategori, setKategori] = useState(ARAC_KATEGORILERI[0].id);
  const [duzenlenenId, setDuzenlenenId] = useState(null);

  const formuTemizle = () => { setAd(""); setTutar(""); setKategori(ARAC_KATEGORILERI[0].id); setDuzenlenenId(null); };
  const duzenlemeyeBasla = (k) => { setDuzenlenenId(k.id); setAd(k.ad); setTutar(String(k.tutar)); setKategori(k.kategori); };

  const kaydet = () => {
    const t = parseFloat(tutar.replace(",", "."));
    if (!t || t <= 0) return;
    const katInfo = ARAC_KATEGORILERI.find((k) => k.id === kategori);
    const veri = { id: duzenlenenId || uid(), ad: ad.trim() || katInfo.label, tutar: t, kategori };
    if (duzenlenenId) onGuncelle(veri); else onEkle(veri);
    formuTemizle();
  };

  const kartListesi = (kartKalemleri || []).map((k) => ({
    id: k.id, ad: k.aciklama, tutar: k.tutar,
    kategori: k.kategori === "yakit" ? "yakit" : "diger",
    kartKaynakli: true, kartBanka: k.kartBanka,
  }));
  const tumKalemler = [...kalemler, ...kartListesi];

  const toplam = tumKalemler.reduce((s, k) => s + k.tutar, 0);
  const kategoriToplamlari = ARAC_KATEGORILERI.map((k) => ({
    ...k, toplam: tumKalemler.filter((x) => x.kategori === k.id).reduce((s, x) => s + x.tutar, 0),
  })).filter((k) => k.toplam > 0);

  return (
    <div className="rounded-2xl bg-[#F1ECE1] p-5 shadow-sm">
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-2"><span>🚗</span><h3 className="font-semibold text-[#1B2430] tracking-tight">Araç Giderleri</h3></div>
        <span className="font-mono text-sm font-semibold text-[#2F6E5C]">{tl(toplam)}</span>
      </div>

      {kartListesi.length > 0 && (
        <p className="text-[11px] text-[#8A8272] mb-3 leading-relaxed">💳 işaretli kalemler kredi kartı ekstrenden otomatik geldi — bunları Kredi Kartı sekmesindeki harcama raporundan düzenleyebilir veya kategorisini değiştirebilirsin.</p>
      )}

      {kategoriToplamlari.length > 0 && (
        <div className="mb-4">
          <div className="flex h-2.5 rounded-full overflow-hidden mb-2">
            {kategoriToplamlari.map((k) => <div key={k.id} style={{ width: `${(k.toplam / toplam) * 100}%`, backgroundColor: k.renk }} />)}
          </div>
          <div className="flex flex-wrap gap-x-4 gap-y-1">
            {kategoriToplamlari.map((k) => (
              <span key={k.id} className="text-[11px] text-[#6B7280] flex items-center gap-1">
                <span className="w-2 h-2 rounded-full inline-block" style={{ backgroundColor: k.renk }} />
                {k.label}: {tl(k.toplam)}
              </span>
            ))}
          </div>
        </div>
      )}

      <div className="space-y-2 mb-4 max-h-52 overflow-y-auto">
        {tumKalemler.length === 0 && <p className="text-sm text-[#8A8272] italic">Henüz araç gideri eklenmedi.</p>}
        {tumKalemler.map((k) => {
          const katInfo = ARAC_KATEGORILERI.find((x) => x.id === k.kategori) || ARAC_KATEGORILERI[4];
          if (k.kartKaynakli) {
            return (
              <div key={k.id} className="flex items-center justify-between rounded-lg px-3 py-2 text-sm bg-[#C9A227]/10">
                <div className="flex items-center gap-2 min-w-0">
                  <span style={{ color: katInfo.renk }}>{katInfo.emoji}</span>
                  <span className="text-[#1B2430]">{k.ad}</span>
                  <span className="text-[10px] text-[#8A8272]">💳 {k.kartBanka}</span>
                </div>
                <span className="font-mono text-[#4A4438] ml-2">{tl(k.tutar)}</span>
              </div>
            );
          }
          return (
            <div key={k.id} className={`flex items-center justify-between rounded-lg px-3 py-2 text-sm ${duzenlenenId === k.id ? "bg-[#2F6E5C]/15 ring-1 ring-[#2F6E5C]" : "bg-white/60"}`}>
              <div className="flex items-center gap-2">
                <span style={{ color: katInfo.renk }}>{katInfo.emoji}</span>
                <span className="text-[#1B2430]">{k.ad}</span>
              </div>
              <div className="flex items-center gap-3">
                <span className="font-mono text-[#4A4438]">{tl(k.tutar)}</span>
                <button onClick={() => duzenlemeyeBasla(k)} className="text-[#6B7280] hover:text-[#1B2430]">✏️</button>
                <button onClick={() => onSil(k.id)} className="text-[#B24C34]/60 hover:text-[#B24C34]">🗑</button>
              </div>
            </div>
          );
        })}
      </div>

      {duzenlenenId && <p className="text-[11px] text-[#2F6E5C] font-medium mb-1.5">Kalem düzenleniyor</p>}
      <div className="flex flex-wrap gap-1.5 mb-2">
        {ARAC_KATEGORILERI.map((k) => (
          <button key={k.id} onClick={() => setKategori(k.id)} className="text-xs px-2.5 py-1 rounded-full border"
            style={{ borderColor: k.renk, color: kategori === k.id ? "white" : k.renk, backgroundColor: kategori === k.id ? k.renk : "transparent" }}>
            {k.label}
          </button>
        ))}
      </div>
      <div className="flex gap-2">
        <input value={ad} onChange={(e) => setAd(e.target.value)} placeholder="Not (opsiyonel)"
          className="flex-1 min-w-0 rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#2F6E5C]" />
        <input value={tutar} onChange={(e) => setTutar(e.target.value)} onKeyDown={(e) => e.key === "Enter" && kaydet()}
          inputMode="decimal" placeholder="₺"
          className="w-24 rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#2F6E5C]" />
        {duzenlenenId && <button onClick={formuTemizle} className="rounded-lg px-3 text-[#6B7280] border border-[#D8D0BE] active:scale-95">✕</button>}
        <button onClick={kaydet} className="rounded-lg px-3 text-white bg-[#2F6E5C] active:scale-95">{duzenlenenId ? "✓" : "+"}</button>
      </div>
    </div>
  );
}

          className="flex-1 min-w-0 rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#3E5C9A]" />
        {duzenlenenId && <button onClick={formuTemizle} className="rounded-lg px-3 text-[#6B7280] border border-[#D8D0BE] active:scale-95">✕</button>}
        <button onClick={kaydet} className="rounded-lg px-3 text-white bg-[#3E5C9A] active:scale-95">{duzenlenenId ? "✓" : "+"}</button>
      </div>
    </div>
  );
}

function KrediKartiSatiri({ kart, onSil, acik, onToggle, onDuzenleBaslat, onKategoriDegistir }) {
  const plan = useMemo(() => hesaplaAsgariOdemePlani({
    bakiye: kart.bakiye, aylikFaizYuzde: kart.faiz, asgariYuzde: kart.asgariYuzde, tabanOdeme: 0, vergiYuzde: kart.vergiYuzde,
  }), [kart.bakiye, kart.faiz, kart.asgariYuzde, kart.vergiYuzde]);
  const grafikVerisi = plan.rows.filter((_, i) => i % Math.ceil(plan.rows.length / 40 || 1) === 0);
  const kalanGun = sonrakiTekrarGunSayisi(kart.gun);
  const yakinda = kalanGun !== null && kalanGun <= 7;

  return (
    <div className="rounded-2xl bg-white shadow-sm overflow-hidden">
      <button onClick={onToggle} className="w-full text-left p-4 flex items-center justify-between">
        <div>
          <div className="flex items-center gap-2"><span>💳</span><span className="font-semibold text-[#1B2430] text-sm">{kart.banka}</span></div>
          <div className="flex items-center gap-2 mt-1">
            <span className="font-mono text-xs text-[#4A4438]">{tl(kart.bakiye)} bakiye</span>
            {kalanGun !== null && (
              <span className={`text-[11px] ${yakinda ? "text-[#B24C34] font-medium" : "text-[#8A8272]"}`}>
                🕐 {kalanGun === 0 ? "bugün son ödeme" : `${kalanGun} gün sonra son ödeme`}
              </span>
            )}
          </div>
        </div>
        <div className="flex items-center gap-2">
          <span onClick={(e) => { e.stopPropagation(); onSil(kart.id); }} className="text-[#B24C34]/60 hover:text-[#B24C34] p-1">🗑</span>
          <span className="text-[#6B7280]">{acik ? "▲" : "▼"}</span>
        </div>
      </button>

      {acik && (
        <div className="px-4 pb-4 space-y-3 border-t border-[#F1ECE1] pt-3">
          {plan.hicBitmiyor ? (
            <div className="flex gap-2 rounded-xl bg-[#3A241D] p-3 text-[#F1ECE1]">
              <span>⚠️</span>
              <p className="text-xs leading-relaxed">Bu oranlarla asgari ödeme faiz ve vergiyi karşılamıyor, bakiye hiç azalmaz.</p>
            </div>
          ) : (
            <React.Fragment>
              <div className="rounded-xl bg-[#1B2430] p-4">
                <p className="text-[11px] uppercase tracking-wider text-[#8A93A3] mb-1">Sadece Asgari Ödersen Toplam Faiz + Vergi</p>
                <p className="font-serif text-2xl font-semibold text-[#C9A227] tabular-nums">{tl(plan.toplamFaiz)}</p>
                <p className="text-[11px] text-[#8A93A3] mt-1">{plan.bitmedi ? "50 yılda bile kapanmıyor." : `${plan.aySayisi} ayda kapanır`}</p>
              </div>
              <BorcGrafigi data={grafikVerisi} gradientId={`grad-${kart.id}`} />
            </React.Fragment>
          )}
          <div className="grid grid-cols-2 gap-x-3 gap-y-1 text-[11px] text-[#8A8272]">
            <span>Aylık faiz: %{kart.faiz}</span>
            <span>Asgari oran: %{kart.asgariYuzde}</span>
            <span>KKDF+BSMV: %{kart.vergiYuzde}</span>

          <HarcamaRaporu islemler={kart.islemler} onKategoriDegistir={(aciklama, kategori) => onKategoriDegistir(kart.id, aciklama, kategori)} />

          <button onClick={() => onDuzenleBaslat(kart)} className="w-full flex items-center justify-center gap-1.5 rounded-lg py-2 text-sm font-medium text-[#1B2430] border border-[#D8D0BE] active:scale-95">

      )}

}

function HarcamaRaporu({ islemler, onKategoriDegistir }) {
  const [acik, setAcik] = useState(false);

  if (!islemler || islemler.length === 0) {
    return (
      <div className="rounded-xl bg-[#F1ECE1] p-3">
        <p className="text-[11px] text-[#8A8272] leading-relaxed">Bu kart için henüz harcama raporu yok. Ekstreyi PDF olarak yükleyip düzenlersen işlemler otomatik olarak buraya kategorilere ayrılarak eklenir.</p>
      </div>
    );
  }

  const toplam = islemler.reduce((s, k) => s + k.tutar, 0);
  const kategoriToplamlari = HARCAMA_KATEGORILERI.map((k) => ({
    ...k, toplam: islemler.filter((x) => x.kategori === k.id).reduce((s, x) => s + x.tutar, 0),
  })).filter((k) => k.toplam > 0);

  const gruplarMap = {};
  for (const islem of islemler) {
    if (!gruplarMap[islem.aciklama]) gruplarMap[islem.aciklama] = [];
    gruplarMap[islem.aciklama].push(islem);
  }
  const gruplar = Object.entries(gruplarMap)
    .map(([aciklama, kalemler]) => ({
      aciklama, kalemler,
      toplam: kalemler.reduce((s, k) => s + k.tutar, 0),
      kategori: kalemler[0].kategori,
    }))
    .sort((a, b) => b.toplam - a.toplam);

  return (
    <div className="rounded-xl bg-[#F1ECE1] p-3">
      <button onClick={() => setAcik((a) => !a)} className="w-full flex items-center justify-between">
        <span className="text-xs font-semibold text-[#1B2430]">📊 Harcama Raporu · {islemler.length} işlem</span>
        <span className="text-[#6B7280]">{acik ? "▲" : "▼"}</span>
      </button>

      <div className="flex h-2 rounded-full overflow-hidden mt-2 mb-2">
        {kategoriToplamlari.map((k) => <div key={k.id} style={{ width: `${(k.toplam / toplam) * 100}%`, backgroundColor: k.renk }} />)}
      </div>
      <div className="flex flex-wrap gap-x-3 gap-y-1">
        {kategoriToplamlari.map((k) => (
          <span key={k.id} className="text-[11px] text-[#6B7280] flex items-center gap-1">
            <span className="w-2 h-2 rounded-full inline-block" style={{ backgroundColor: k.renk }} />
            {k.label}: {tl(k.toplam)}
          </span>
        ))}
      </div>

      {acik && (
        <div className="mt-3 space-y-2 max-h-64 overflow-y-auto">
          {gruplar.map((grup) => {
            const kat = HARCAMA_KATEGORILERI.find((k) => k.id === grup.kategori) || HARCAMA_KATEGORILERI[HARCAMA_KATEGORILERI.length - 1];
            return (
              <div key={grup.aciklama} className="bg-white/60 rounded-lg p-2.5">
                <div className="flex items-center justify-between gap-2 mb-1.5">
                  <div className="flex items-center gap-1.5 min-w-0">
                    <span className="w-1.5 h-1.5 rounded-full inline-block" style={{ backgroundColor: kat.renk }} />
                    <span className="text-[11px] font-medium text-[#1B2430]">{grup.aciklama}</span>
                    {grup.kalemler.length > 1 && <span className="text-[10px] text-[#8A8272]">×{grup.kalemler.length}</span>}
                  </div>
                  <span className="font-mono text-[11px] text-[#4A4438]">{tl(grup.toplam)}</span>
                </div>
                <div className="space-y-0.5 mb-1.5">
                  {grup.kalemler.map((k) => (
                    <p key={k.id} className="text-[10px] text-[#8A8272]">
                      {k.tarih ? `${k.tarih} · ` : ""}{tl(k.tutar)}{k.taksit ? ` · ${k.taksit.no}/${k.taksit.sayisi} taksit` : ""}
                    </p>
                  ))}
                </div>
                <select value={grup.kategori} onChange={(e) => onKategoriDegistir(grup.aciklama, e.target.value)}
                  className="w-full text-[11px] rounded-md border border-[#D8D0BE] bg-white px-2 py-1 text-[#1B2430]">
                  {HARCAMA_KATEGORILERI.map((k) => <option key={k.id} value={k.id}>{k.label}</option>)}
                </select>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function KartlarBolumu({ kartlar, onEkle, onGuncelle, onSil }) {
  const [banka, setBanka] = useState("");
  const [bakiye, setBakiye] = useState("");
  const [faiz, setFaiz] = useState("3.99");
  const [asgariYuzde, setAsgariYuzde] = useState("20");
  const [vergiYuzde, setVergiYuzde] = useState("15");
  const [gun, setGun] = useState("");
  const [acikId, setAcikId] = useState(null);
  const [duzenlenenId, setDuzenlenenId] = useState(null);
  const [pdfYukleniyor, setPdfYukleniyor] = useState(false);
  const [pdfHata, setPdfHata] = useState("");
  const [pdfBasarili, setPdfBasarili] = useState(false);
  const [islemler, setIslemler] = useState([]);

  const formuTemizle = () => {
    setBanka(""); setBakiye(""); setFaiz("3.99"); setAsgariYuzde("20"); setVergiYuzde("15"); setGun(""); setDuzenlenenId(null);
    setPdfHata(""); setPdfBasarili(false); setIslemler([]);
  };

  const duzenlemeyeBasla = (kart) => {
    setDuzenlenenId(kart.id); setBanka(kart.banka); setBakiye(String(kart.bakiye));
    setFaiz(String(kart.faiz)); setAsgariYuzde(String(kart.asgariYuzde)); setVergiYuzde(String(kart.vergiYuzde));
    setGun(kart.gun ? String(kart.gun) : "");
    setIslemler(kart.islemler || []);
  };

  const ekstreYukle = async (e) => {
    const dosya = e.target.files[0];
    if (!dosya) return;
    setPdfHata(""); setPdfBasarili(false); setPdfYukleniyor(true);
    try {
      const metin = await pdfMetniCikar(dosya);
      const cikti = ekstreVerisiCikar(metin);
      let bulunan = 0;
      if (cikti.banka) { setBanka(cikti.banka); bulunan++; }
      if (cikti.bakiye) { setBakiye(String(cikti.bakiye)); bulunan++; }
      if (cikti.asgariOdemeYuzdesi) { setAsgariYuzde(String(Math.round(cikti.asgariOdemeYuzdesi))); bulunan++; }
      if (cikti.faizYuzdesi) { setFaiz(String(cikti.faizYuzdesi)); bulunan++; }
      if (cikti.sonOdemeGunu) { setGun(String(cikti.sonOdemeGunu)); bulunan++; }
      if (cikti.islemler && cikti.islemler.length > 0) { setIslemler(cikti.islemler); bulunan++; }
      if (bulunan === 0) {
        setPdfHata("Ekstrede tanıdık bir alan bulunamadı. Bilgileri elle girebilirsin.");
      } else {
        setPdfBasarili(true);
      }
    } catch (err) {
      setPdfHata("Ekstre okunamadı. Bilgileri aşağıdan elle girebilirsin.");
    } finally {
      setPdfYukleniyor(false);
      e.target.value = "";
    }
  };

  const kaydet = () => {
    const b = parseFloat(bakiye.replace(",", "."));
    if (!banka || !b || b <= 0) return;
    const veri = {
      id: duzenlenenId || uid(), banka, bakiye: b,
      faiz: parseFloat(faiz) || 0, asgariYuzde: parseFloat(asgariYuzde) || 0, vergiYuzde: parseFloat(vergiYuzde) || 0,
      gun: gun ? parseInt(gun, 10) : null,
      islemler,
    };
    if (duzenlenenId) { onGuncelle(veri); setAcikId(veri.id); } else { onEkle(veri); setAcikId(veri.id); }
    formuTemizle();
  };

  const sirali = [...kartlar].sort((a, b) => {
    const ga = sonrakiTekrarGunSayisi(a.gun), gb = sonrakiTekrarGunSayisi(b.gun);
    if (ga === null) return 1;
    if (gb === null) return -1;
    return ga - gb;
  });

  const kategoriDegistir = (kartId, aciklama, yeniKategori) => {
    const kart = kartlar.find((k) => k.id === kartId);
    if (!kart) return;
    const yeniIslemler = (kart.islemler || []).map((i) => i.aciklama === aciklama ? { ...i, kategori: yeniKategori } : i);
    onGuncelle({ ...kart, islemler: yeniIslemler });
  };

  return (
    <div className="space-y-3">
      {sirali.length === 0 && <p className="text-sm text-[#8A8272] italic px-1">Henüz kredi kartı eklenmedi.</p>}
      {sirali.map((k) => (
        <KrediKartiSatiri key={k.id} kart={k} onSil={onSil} acik={acikId === k.id} onToggle={() => setAcikId(acikId === k.id ? null : k.id)} onDuzenleBaslat={duzenlemeyeBasla} onKategoriDegistir={kategoriDegistir} />
      ))}

      <div className="rounded-2xl bg-[#F1ECE1] border border-[#D8D0BE] p-5">
        <div className="flex items-center gap-2 mb-4"><span>💳</span><h3 className="font-semibold tracking-tight">{duzenlenenId ? "Kredi Kartını Düzenle" : "Yeni Kredi Kartı Ekle"}</h3></div>

        <label className={`flex items-center justify-center gap-2 rounded-xl border-2 p-3 mb-2 text-sm font-medium cursor-pointer ${pdfYukleniyor ? "text-[#C9A227]" : "text-[#6B7280]"}`} style={{ borderStyle: "dashed", borderColor: pdfYukleniyor ? "#C9A227" : "#D8D0BE" }}>
          <input type="file" accept="application/pdf" className="hidden" onChange={ekstreYukle} disabled={pdfYukleniyor} />
          {pdfYukleniyor ? <>📄 Ekstre okunuyor...</> : <>⬆️ Ekstreyi PDF olarak yükle, otomatik doldursun</>}
        </label>
        {pdfBasarili && <p className="text-[11px] text-[#2F6E5C] font-medium mb-3">Ekstreden okunan bilgiler aşağıya dolduruldu{islemler.length > 0 ? ` · ${islemler.length} işlem bulundu` : ""} — kaydetmeden önce kontrol et.</p>}
        {pdfHata && <p className="text-[11px] text-[#B24C34] mb-3">{pdfHata}</p>}

        <div className="flex flex-wrap gap-1.5 mb-3">
          {BANKALAR.map((b) => (
            <button key={b} onClick={() => setBanka(b)} className="text-xs px-2.5 py-1 rounded-full border"
              style={{ borderColor: "#C9A227", color: banka === b ? "white" : "#C9A227", backgroundColor: banka === b ? "#C9A227" : "transparent" }}>
              {b}
            </button>
          ))}
        </div>
        <input value={banka} onChange={(e) => setBanka(e.target.value)} placeholder="Banka adı (yukarıdan seç veya yaz)"
          className="w-full mb-3 rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
        <div className="grid grid-cols-2 gap-3">
          <label className="text-xs text-[#6B7280]">Kart Bakiyesi (₺)
            <input value={bakiye} onChange={(e) => setBakiye(e.target.value)} inputMode="decimal"
              className="mt-1 w-full rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
          </label>
          <label className="text-xs text-[#6B7280]">Son Ödeme Günü
            <input value={gun} onChange={(e) => setGun(e.target.value.replace(/\D/g, "").slice(0, 2))} inputMode="numeric" placeholder="Ör. 12"
              className="mt-1 w-full rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
          </label>
          <label className="text-xs text-[#6B7280]">Aylık Faiz (%)
            <input value={faiz} onChange={(e) => setFaiz(e.target.value)} inputMode="decimal"
              className="mt-1 w-full rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
          </label>
          <label className="text-xs text-[#6B7280]">Asgari Ödeme Oranı (%)
            <input value={asgariYuzde} onChange={(e) => setAsgariYuzde(e.target.value)} inputMode="decimal"
              className="mt-1 w-full rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
          </label>
          <label className="text-xs text-[#6B7280] col-span-2">KKDF+BSMV (%)
            <input value={vergiYuzde} onChange={(e) => setVergiYuzde(e.target.value)} inputMode="decimal"
              className="mt-1 w-full rounded-lg border border-[#D8D0BE] bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C9A227]" />
          </label>
        </div>
        <p className="text-[11px] text-[#8A8272] mt-3 leading-relaxed">Oranlar bankandan bankaya değişir; güncel faiz, asgari ödeme yüzdesi ve vergi oranlarını kart ekstrenden veya bankandan teyit et.</p>
        <div className="flex gap-2 mt-3">
          {duzenlenenId && <button onClick={formuTemizle} className="rounded-lg px-4 text-[#6B7280] border border-[#D8D0BE] active:scale-95">✕</button>}
          <button onClick={kaydet} className="flex-1 rounded-lg py-2.5 text-white font-medium bg-[#C9A227] active:scale-95 flex items-center justify-center gap-2">
            {duzenlenenId ? "✓ Değişiklikleri Kaydet" : "＋ Kartı Ekle"}
          </button>
        </div>
      </div>
    </div>
  );
}

function DokumBolumu({ gelirler, sabitGiderler, abonelikler, aracGiderleri, krediler }) {
  const [ofset, setOfset] = useState(0);
  const { etiket } = ayBilgisi(ofset);

  const tumKalemler = [
    ...gelirler.map((k) => ({ ...k, tip: "gelir" })),
    ...sabitGiderler.map((k) => ({ ...k, tip: "gider" })),
    ...abonelikler.map((k) => ({ ...k, tip: "gider" })),
    ...aracGiderleri.map((k) => ({ ...k, tip: "gider" })),
    ...krediler.map((k) => ({ ...k, ad: `${k.banka} · ${k.ad}`, tip: "gider" })),
  ];
  const tarihli = tumKalemler.filter((k) => k.gun).sort((a, b) => a.gun - b.gun);
  const tarihsiz = tumKalemler.filter((k) => !k.gun);
  const sirali = [...tarihli, ...tarihsiz];

  let bakiye = 0;
  const satirlar = sirali.map((k) => {
    bakiye += k.tip === "gelir" ? k.tutar : -k.tutar;
    return { ...k, bakiye };
  });

  const toplamGelir = gelirler.reduce((s, k) => s + k.tutar, 0);
  const toplamGider = sabitGiderler.reduce((s, k) => s + k.tutar, 0) + abonelikler.reduce((s, k) => s + k.tutar, 0) + aracGiderleri.reduce((s, k) => s + k.tutar, 0) + krediler.reduce((s, k) => s + k.tutar, 0);
  const net = toplamGelir - toplamGider;

  return (
    <div className="space-y-5 pb-10">
      <div className="rounded-2xl bg-[#1B2430] p-4 flex items-center justify-between">
        <button onClick={() => setOfset((o) => o - 1)} className="text-[#8A93A3] hover:text-white p-1">‹</button>
        <span className="font-serif text-lg font-semibold text-[#F1ECE1]">{etiket}</span>
        <button onClick={() => setOfset((o) => o + 1)} className="text-[#8A93A3] hover:text-white p-1">›</button>
      </div>

      {ofset !== 0 && <button onClick={() => setOfset(0)} className="text-xs text-[#8A5FBF] underline underline-offset-2">Bu aya dön</button>}

      <div className="rounded-2xl bg-white shadow-sm overflow-hidden">
        {satirlar.length === 0 && <p className="text-sm text-[#8A8272] italic p-5">Henüz kalem eklenmedi.</p>}
        {satirlar.map((k, i) => (
          <div key={k.id + i} className="flex items-center justify-between px-4 py-3 border-b border-[#F1ECE1] last:border-0">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-full bg-[#F1ECE1] flex items-center justify-center text-xs font-semibold text-[#6B7280]">{k.gun ? k.gun : "—"}</div>
              <div>
                <p className="text-sm text-[#1B2430]">{k.ad}</p>
                <p className="text-[11px] text-[#8A8272]">{k.gun ? `Her ayın ${k.gun}'i` : "Tarihsiz"}</p>
              </div>
            </div>
            <div className="text-right">
              <p className="font-mono text-sm font-medium" style={{ color: k.tip === "gelir" ? "#2F6E5C" : "#B24C34" }}>
                {k.tip === "gelir" ? "+" : "−"}{tl(k.tutar)}
              </p>
              <p className="text-[11px] text-[#8A8272] font-mono">bakiye {tl(k.bakiye)}</p>
            </div>
          </div>
        ))}
      </div>

      <div className="rounded-2xl bg-[#F1ECE1] p-4 flex gap-3">
        <div className="flex-1"><p className="text-xs text-[#6B7280]">Toplam Gelir</p><p className="font-mono text-sm font-semibold text-[#2F6E5C]">{tl(toplamGelir)}</p></div>
        <div className="flex-1"><p className="text-xs text-[#6B7280]">Toplam Gider</p><p className="font-mono text-sm font-semibold text-[#B24C34]">{tl(toplamGider)}</p></div>
        <div className="flex-1"><p className="text-xs text-[#6B7280]">Net</p><p className="font-mono text-sm font-semibold" style={{ color: net >= 0 ? "#C9A227" : "#E1786A" }}>{tl(net)}</p></div>
      </div>
      <p className="text-[11px] text-[#8A8272] leading-relaxed">Bu döküm, düzenli (tekrar eden) kalemlerine göre hesaplanır. Tekrar günü belirtmediğin kalemler her ayın toplamına dahil olur ama listede "Tarihsiz" görünür.</p>
    </div>
  );
}

function OzetKarti({ label, deger, renk, alt }) {
  return (
    <div className="rounded-2xl bg-[#1B2430] p-5 flex-1 min-w-[140px]">
      <p className="text-xs uppercase tracking-wider text-[#8A93A3] mb-1">{label}</p>
      <p className="text-2xl font-serif font-semibold tabular-nums" style={{ color: renk }}>{tl(deger)}</p>
      {alt && <p className="text-xs text-[#8A93A3] mt-1">{alt}</p>}
    </div>
  );
}

function HesapKitap() {
  const [sekme, setSekme] = useState("ozet");
  const [gelirler, setGelirler] = useState([]);
  const [sabitGiderler, setSabitGiderler] = useState([]);
  const [abonelikler, setAbonelikler] = useState([]);
  const [aracGiderleri, setAracGiderleri] = useState([]);
  const [krediler, setKrediler] = useState([]);
  const [krediKartlari, setKrediKartlari] = useState([]);
  const [karanlikMod, setKaranlikMod] = useState(false);
  const [yukleniyor, setYukleniyor] = useState(true);

  useEffect(() => {
    try {
      const kayit = localStorage.getItem("hesap-kitap-veri");
      if (kayit) {
        const parsed = JSON.parse(kayit);
        setGelirler(parsed.gelirler || []);
        setSabitGiderler(parsed.sabitGiderler || []);
        setAbonelikler(parsed.abonelikler || []);
        setAracGiderleri(parsed.aracGiderleri || []);
        setKrediler(parsed.krediler || []);
        setKrediKartlari(parsed.krediKartlari || []);
        setKaranlikMod(!!parsed.karanlikMod);
      }
    } catch (e) {}
    setYukleniyor(false);
  }, []);

  useEffect(() => {
    if (yukleniyor) return;
    localStorage.setItem("hesap-kitap-veri", JSON.stringify({ gelirler, sabitGiderler, abonelikler, aracGiderleri, krediler, krediKartlari, karanlikMod }));
  }, [gelirler, sabitGiderler, abonelikler, aracGiderleri, krediler, krediKartlari, karanlikMod, yukleniyor]);

  const toplamGelir = gelirler.reduce((s, k) => s + k.tutar, 0);
  const toplamSabitGider = sabitGiderler.reduce((s, k) => s + k.tutar, 0);
  const toplamAbonelik = abonelikler.reduce((s, k) => s + k.tutar, 0);
  const toplamKredi = krediler.reduce((s, k) => s + k.tutar, 0);

  const kartAracKalemleri = [];
  krediKartlari.forEach((k) => {
    (k.islemler || []).forEach((i) => {
      if (ARAC_SENKRON_KATEGORILERI.includes(i.kategori)) kartAracKalemleri.push({ ...i, kartId: k.id, kartBanka: k.banka });
    });
  });
  const toplamKartArac = kartAracKalemleri.reduce((s, i) => s + i.tutar, 0);
  const toplamArac = aracGiderleri.reduce((s, k) => s + k.tutar, 0) + toplamKartArac;

  const toplamKartHarcamasi = krediKartlari.reduce(
    (s, k) => s + (k.islemler || []).filter((i) => !ARAC_SENKRON_KATEGORILERI.includes(i.kategori)).reduce((s2, i) => s2 + i.tutar, 0),
    0
  );
  const toplamGider = toplamSabitGider + toplamAbonelik + toplamArac + toplamKredi + toplamKartHarcamasi;
  const net = toplamGelir - toplamGider;

  const sekmeler = [
    { id: "ozet", label: "Özet" },
    { id: "abonelik", label: "Abonelik" },
    { id: "arac", label: "Araç" },
    { id: "krediler", label: "Krediler" },
    { id: "kart", label: "Kredi Kartı" },
    { id: "dokum", label: "Dökümler" },
  ];

  return (
    <div className={`min-h-screen bg-[#F1ECE1] text-[#1B2430] ${karanlikMod ? "tema-koyu" : ""}`}>
      <div className="bg-[#1B2430] px-5 pt-8 pb-16 rounded-b-[2rem]">
        <div className="flex items-start justify-between gap-3">
          <div>
            <h1 className="font-serif text-2xl font-semibold text-[#F1ECE1]">Hesap Kitap</h1>
            <p className="text-sm text-[#8A93A3] mt-1">Gelirini, giderini, aboneliklerini ve kart borcunu tek yerden gör.</p>
          </div>
          <div className="flex flex-col items-end gap-2">
            <button onClick={() => setKaranlikMod((k) => !k)} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-[#F1ECE1] active:scale-95">
              {karanlikMod ? "☀️" : "🌙"}
            </button>
            <div className="flex items-center gap-1.5 text-[#C9A227] text-xs font-medium whitespace-nowrap">
              <span>📅</span><span>{bugunEtiketi()}</span>
            </div>
          </div>
        </div>
      </div>

      <div className="max-w-md mx-auto -mt-10 px-4">
        <div className="flex bg-white rounded-full p-1 shadow-md mb-5 overflow-x-auto">
          {sekmeler.map((t) => (
            <button key={t.id} onClick={() => setSekme(t.id)}
              className={`flex-1 whitespace-nowrap px-2 py-2 rounded-full text-sm font-medium ${sekme === t.id ? "bg-[#1B2430] text-white" : "text-[#6B7280]"}`}>
              {t.label}
            </button>
          ))}
        </div>

        {sekme === "ozet" && (
          <div className="space-y-5 pb-10">
            <div className="flex gap-3">
              <OzetKarti label="Toplam Gelir" deger={toplamGelir} renk="#7FBFA6" />
              <OzetKarti label="Toplam Gider" deger={toplamGider} renk="#E19E86" />
            </div>
            <OzetKarti label={net >= 0 ? "Ay Sonu Fazlan" : "Ay Sonu Açığın"} deger={net}
              renk={net >= 0 ? "#C9A227" : "#E1786A"} alt={net >= 0 ? "Gelirin giderini karşılıyor." : "Giderin gelirini aşıyor."} />

            <div className="rounded-2xl bg-white p-4 shadow-sm">
              <p className="text-xs font-medium text-[#6B7280] mb-2">Gider Dağılımı</p>
              <div className="space-y-1.5 text-sm">
                <div className="flex justify-between"><span className="text-[#4A4438]">Sabit Giderler</span><span className="font-mono text-[#B24C34]">{tl(toplamSabitGider)}</span></div>
                <div className="flex justify-between"><span className="text-[#4A4438]">Abonelikler</span><span className="font-mono text-[#8A5FBF]">{tl(toplamAbonelik)}</span></div>
                <div className="flex justify-between"><span className="text-[#4A4438]">Araç Giderleri</span><span className="font-mono text-[#2F6E5C]">{tl(toplamArac)}</span></div>
                <div className="flex justify-between"><span className="text-[#4A4438]">Kredi Taksitleri</span><span className="font-mono text-[#3E5C9A]">{tl(toplamKredi)}</span></div>
                <div className="flex justify-between"><span className="text-[#4A4438]">Kart Harcamaları (Ekstre)</span><span className="font-mono text-[#C9A227]">{tl(toplamKartHarcamasi)}</span></div>
              </div>
            </div>

            <VadeliHesapHesaplayici onEkle={(k) => setGelirler((g) => [...g, k])} />

            <KalemListesi baslik="Gelirler" renk="#2F6E5C" emoji="📈" kalemler={gelirler}
              onEkle={(k) => setGelirler((g) => [...g, k])}
              onGuncelle={(k) => setGelirler((g) => g.map((x) => (x.id === k.id ? k : x)))}
              onSil={(id) => setGelirler((g) => g.filter((x) => x.id !== id))} />
            <KalemListesi baslik="Sabit Giderler" renk="#B24C34" emoji="📉" kalemler={sabitGiderler}
              onEkle={(k) => setSabitGiderler((g) => [...g, k])}
              onGuncelle={(k) => setSabitGiderler((g) => g.map((x) => (x.id === k.id ? k : x)))}
              onSil={(id) => setSabitGiderler((g) => g.filter((x) => x.id !== id))} />
          </div>
        )}

        {sekme === "abonelik" && (
          <div className="pb-10">
            <AbonelikBolumu kalemler={abonelikler} onEkle={(k) => setAbonelikler((a) => [...a, k])}
              onGuncelle={(k) => setAbonelikler((a) => a.map((x) => (x.id === k.id ? k : x)))}
              onSil={(id) => setAbonelikler((a) => a.filter((x) => x.id !== id))} />
          </div>
        )}

        {sekme === "arac" && (
          <div className="pb-10">
            <AracGiderBolumu kalemler={aracGiderleri} kartKalemleri={kartAracKalemleri} onEkle={(k) => setAracGiderleri((a) => [...a, k])}
              onGuncelle={(k) => setAracGiderleri((a) => a.map((x) => (x.id === k.id ? k : x)))}
              onSil={(id) => setAracGiderleri((a) => a.filter((x) => x.id !== id))} />
          </div>
        )}

        {sekme === "krediler" && (
          <div className="pb-10">
            <KrediBolumu kalemler={krediler} onEkle={(k) => setKrediler((g) => [...g, k])}
              onGuncelle={(k) => setKrediler((g) => g.map((x) => (x.id === k.id ? k : x)))}
              onSil={(id) => setKrediler((g) => g.filter((x) => x.id !== id))} />
          </div>
        )}

        {sekme === "kart" && (
          <div className="pb-10">
            <KartlarBolumu kartlar={krediKartlari} onEkle={(k) => setKrediKartlari((g) => [...g, k])}
              onGuncelle={(k) => setKrediKartlari((g) => g.map((x) => (x.id === k.id ? k : x)))}
              onSil={(id) => setKrediKartlari((g) => g.filter((x) => x.id !== id))} />
          </div>
        )}

        {sekme === "dokum" && (
          <DokumBolumu gelirler={gelirler} sabitGiderler={sabitGiderler} abonelikler={abonelikler} aracGiderleri={aracGiderleri} krediler={krediler} />
        )}

        <p className="text-center text-[11px] text-[#8A8272] pb-6 pt-2">İsmetcan Özkütükçü tarafından tasarlanmıştır</p>
      </div>
    </div>
  );
}

function BorcGrafigi({ data, gradientId }) {
  const gid = gradientId || "borcGrad";
  const w = 320, h = 160, pad = 28;
  if (!data.length) return null;
  const maxY = Math.max(...data.map((d) => d.bakiye), 1);
  const maxX = Math.max(...data.map((d) => d.ay), 1);
  const x = (ay) => pad + (ay / maxX) * (w - pad * 1.5);
  const y = (bal) => h - pad - (bal / maxY) * (h - pad * 1.5);
  const linePts = data.map((d) => `${x(d.ay)},${y(d.bakiye)}`).join(" ");
  const areaPts = `${x(0)},${y(0)} ` + linePts + ` ${x(data[data.length - 1].ay)},${h - pad}`;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-40">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#B24C34" stopOpacity="0.55" />
          <stop offset="100%" stopColor="#B24C34" stopOpacity="0.03" />
        </linearGradient>
      </defs>
      <line x1={pad} y1={h - pad} x2={w - 6} y2={h - pad} stroke="#EDE7D8" strokeWidth="1" />
      <line x1={pad} y1={6} x2={pad} y2={h - pad} stroke="#EDE7D8" strokeWidth="1" />
      <polygon points={areaPts} fill={`url(#${gid})`} />
      <polyline points={linePts} fill="none" stroke="#B24C34" strokeWidth="2" />
      <text x={pad} y={h - 8} fontSize="9" fill="#8A8272">0. ay</text>
      <text x={w - 30} y={h - 8} fontSize="9" fill="#8A8272">{maxX}. ay</text>
      <text x={2} y={14} fontSize="9" fill="#8A8272">{Math.round(maxY / 1000)}b</text>
    </svg>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HesapKitap />);
</script>
</body>
</html>
